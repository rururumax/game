input{-webkit-user-select:text;user-select:text}

#pk .cn{font-size:22px;font-weight:900}#pk .ci{font-size:30px;font-weight:900}#pk .cnew{color:#d00;font-weight:900;font-size:20px}#pk .cv{font-weight:900;letter-spacing:3px}#pk small{color:#555}

.bk{position:absolute;left:0;right:0;top:26%;text-align:center}.bk .bi{position:relative;display:inline-block;font-size:130px;line-height:1.1}

#ph{white-space:pre-line}
#gift button{pointer-events:auto}

<div id="menu">
<h1>TRPG協力バトル 試作（第3弾）</h1>
<small>チームコードが同じ人は味方、違う人は戦闘の対象（PvP）になります。まず能力値を決めます。各項目の「振る」を押すと、6面ダイス3つを振って合計が能力値になります（振り直しなし）。</small>
<input id="nm" placeholder="名前" maxlength="8" value="冒険者"> <input id="tc" placeholder="チームコード（同じ＝味方／空欄＝ソロ）" maxlength="8" style="width:200px">
<div id="stats" style="width:100%;max-width:360px"></div>
<button id="rall">残りを全部振る</button>
<div id="der" style="color:#fd8"></div><div id="gift" hidden style="max-width:380px"></div>
<div id="cls"></div><small id="cn"></small>
<div id="go"><button id="b1" disabled>1人で試す</button><button id="b2" disabled>部屋を作る</button></div>
<div><input id="code" placeholder="部屋コード" size="8" maxlength="4"> <button id="b3" disabled>参加する</button></div>
<small>移動：WASD／矢印キー、または画面タップ。敵や仲間をタップで対象選択。武器や盾、食べ物は地面に落ちていて、近づくと拾えます。敵に近づくと戦闘開始、敵から25m以上離れると逃げられます。マップに現れる「修行場」の近くに居ると熟練度が上がることがあります。</small>
</div>
<div id="hud" hidden>
<div id="top" class="pnl"><div id="room"></div><div id="ph"></div><div id="bar"><i></i></div><div id="me"></div><button id="bi" style="margin-top:4px;padding:5px 9px">持ち物・ステータス</button></div>
<div id="party" class="pnl"></div><div id="order" class="pnl" hidden></div>
<div id="dice" class="pnl" hidden></div>

</div>

<div id="labels"></div>
<div id="flash"></div><div id="dmgs"></div><div id="toast" hidden></div><div id="brk"></div><div id="pk" hidden></div>
<div id="hpb" class="vb" hidden><div class="n">HP</div><div class="v"><i></i></div><div class="h"></div></div>
<div id="mpb" class="vb" hidden><div class="n">MP</div><div class="v"><i></i></div><div class="h"></div></div>
<div id="tg" class="vb" hidden><div class="n"></div><div class="v"><i></i></div><div class="h"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ===== 設定（すべて仮の値） ===== */
const CFG={see:24,reserve:20,min:1.5,defend:3,speed:5,aggro:10,flee:25,loot:14,dropRate:.1,hngTick:600,spotR:2.5,spotFirst:30};
const $=id=>document.getElementById(id);
const d=n=>1+Math.floor(Math.random()*n),rollA=(n,s)=>Array.from({length:n},()=>d(s)),sumA=a=>a.reduce((x,y)=>x+y,0);
const dbOf=t=>t<=7?{f:-2}:t<=14?{f:-1}:t<=21?{f:0}:t<=28?{n:1,s:4}:{n:1,s:6};
const dbTxt=x=>x.n?`+${x.n}D${x.s}`:(x.f>0?'+':'')+x.f;
const ST=[['str','筋力'],['con','体力'],['siz','体格'],['spd','素早さ'],['int','知性'],['pow','精神力']];
const MSN={ma:'マーシャルアーツ',slash:'斬撃武器',blunt:'打撃武器',snipe:'狙撃武器',heal:'治癒魔法',atk:'攻撃魔法'},GK={'斬撃':'slash','打撃':'blunt','狙撃':'snipe'};
const TH={1:0,2:10,3:20,4:30,5:50,6:70},tierOf=m=>m>=70?6:m>=50?5:m>=30?4:m>=20?3:m>=10?2:1;
const ALL=['warrior','mage','scout','healer'];
const CL={warrior:{n:'戦士',col:0x4a7bd0,note:'筋力判定（受け流し）の出目-2'},mage:{n:'魔術師',col:0xa04ad0,note:'防御判定の出目+2（不利）。杖で攻撃魔法。魔女の加護・呪詛は杖不要'},
scout:{n:'斥候',col:0x3bb06a,note:'素早さ判定（回避）の出目-2'},healer:{n:'治癒師',col:0xe0c04a,note:'通常攻撃に-1D4。治癒魔法（手当・緊急手術・ドレイン）'}};
const IT={
knife:{n:'果物ナイフ',ic:'🔪',t:'w',g:'斬撃',d:[1,4],r:4},dagger:{n:'錆びつきダガー',ic:'🗡️',t:'w',g:'斬撃',d:[1,6],r:4},milk:{n:'ドラゴンの乳歯',ic:'🦷',t:'w',g:'斬撃',d:[2,4],r:4},
axe:{n:'殺人アクス',ic:'🪓',t:'w',g:'斬撃',d:[2,6],r:4.5},fang:{n:'ドラゴンの永久歯',ic:'🐉',t:'w',g:'斬撃',d:[4,4],r:4.5},odachi:{n:'両断大太刀',ic:'⚔️',t:'w',g:'斬撃',d:[10,4],r:6},
hammer:{n:'ガテンハンマー',ic:'🔨',t:'w',g:'打撃',d:[1,20],r:4},staff:{n:'杖',ic:'🪄',t:'w',g:'打撃',d:[1,2],r:4,ip:25},
gum:{n:'輪ゴム鉄砲',ic:'🔫',t:'w',g:'狙撃',d:[1,2],r:12},bow:{n:'猟師の弓',ic:'🏹',t:'w',g:'狙撃',d:[2,4],r:18},xbow:{n:'血まみれクロスボウ',ic:'🩸',t:'w',g:'狙撃',d:[2,6],r:20},
nail:{n:'ガテンの釘打ち機',ic:'📌',t:'w',g:'狙撃',d:[1,20],r:15},long:{n:'近衛兵の長弓',ic:'🎯',t:'w',g:'狙撃',d:[5,6],r:24},bali:{n:'対竜バリスタ',ic:'🐲',t:'w',g:'狙撃',d:[2,20],r:28},
pot:{n:'鍋蓋',ic:'🥘',t:'s',df:5},sign:{n:'きぬた歯科大看板',ic:'🪧',t:'s',df:10},royal:{n:'近衛兵の盾',ic:'🛡️',t:'s',df:15},shell:{n:'金の甲羅',ic:'🐢',t:'s',df:30},
mana:{n:'魔法瓶',ic:'🧪',t:'c',ip:20,use:'mp',v:10},bread:{n:'クロワッサン',ic:'🥐',t:'c',ip:10,use:'hng',v:10},toast:{n:'食パン',ic:'🍞',t:'c',ip:10,use:'hng',v:20},smoke:{n:'煙草',ic:'🚬',t:'c',ip:10,use:'smoke'}};
const ipOf=k=>{const i=IT[k];return i.ip!=null?i.ip:i.t==='w'?i.d[0]*i.d[1]:i.df*3};
const itTxt=k=>{const i=IT[k];return i.t==='w'?`${i.d[0]}D${i.d[1]} ${i.g} 射程${i.r}m`:i.t==='s'?`防御力${i.df}`:i.t==='a'?'装備すると飛べる。専用技：竜の旋風／ドラゴンドレイン':i.t==='x'?'':i.use==='mp'?`消費：MP+${i.v}`:i.use==='hng'?`消費：HNG+${i.v}÷体格`:i.use==='hp'?`消費：HP+${i.v}`:i.use==='mirror'?'消費：行ったことのある場所へワープ（戦闘中は味方全員で離脱）':i.use==='bundle'?'使うと100Q札100枚に両替できる':i.cur?`${i.qv}Q（所持Qの合計に入る）`:i.use==='hp6'?'消費：HP+1D6':'消費：HP-5、SAN+10'};
/* 技。tier=解放ティア gn=熟練度ジャンル atk=攻撃系 mg=魔法 phy=物理(DB加算) */
const SKL={
knee:{n:'飛び膝蹴り',cl:ALL,tg:'e',atk:1,tier:2,gn:'ma',r:3,d:[2,6],phy:1,info:'2D6'},
power:{n:'渾身のパンチ',cl:ALL,tg:'e',atk:1,tier:3,gn:'ma',r:3,d:[4,6],phy:1,info:'4D6'},
grapple:{n:'組み付き',cl:ALL,tg:'e',atk:1,tier:4,gn:'ma',r:3,d:[3,6],phy:1,grap:1,info:'3D6 総ダメージが相手のSAN超で防御不能に'},
moon:{n:'ムーンサルト',cl:ALL,tg:'e',atk:1,tier:5,gn:'ma',r:3,d:[2,20],phy:1,moon:1,info:'2D20 次の自分の防御が不能に'},
ignition:{n:'イグニッション',cl:['mage'],tg:'e',atk:1,tier:1,gn:'atk',staff:1,mg:1,r:18,d:[2,6],info:'2D6 MP=ダメージ'},
lightning:{n:'ライトニング',cl:['mage'],tg:'e',atk:1,tier:2,gn:'atk',staff:1,mg:1,r:18,d:[1,20],info:'1D20 MP=ダメージ'},
landslide:{n:'ランドスライド',cl:['mage'],tg:'x',atk:1,tier:5,gn:'atk',staff:1,mg:1,r:18,d:[1,100],multi:1,info:'敵味方全員に各1D100 MP=合計'},
curse:{n:'呪詛',cl:['mage','healer'],tg:'e',atk:1,tier:1,gn:'atk',mg:1,r:18,d:[1,4],san:1,info:'SAN-1D4（防がれると自分のSANが減る）'},
witch:{n:'魔女の加護',cl:['mage'],tg:'a',tier:1,gn:'atk',mg:1,r:18,info:'アーマー1D4 MP=値×2'},
genki:{n:'元気玉',cl:['mage','healer'],tg:'a',tier:1,gn:'dyn',staff:1,mg:1,r:18,info:'MP+3D6 消費なし'},
tend:{n:'手当',cl:['healer'],tg:'a',tier:1,gn:'heal',mg:1,r:10,d:[2,6],info:'HP+2D6 MP=回復の半分'},
surgery:{n:'緊急手術',cl:['healer'],tg:'a',tier:3,gn:'heal',mg:1,r:10,info:'次ラウンド終了時HP+10D4（復活可）。自分は防御/攻撃不可'},
drain:{n:'ドレイン',cl:['healer'],tg:'e',atk:1,tier:1,gn:'heal',staff:1,mg:1,r:18,d:[3,4],drain:1,info:'3D4を吸収'},

let ri=0;if(inB){const tm={};S.P.forEach(p=>{if(isAlly(p)&&p.al&&p.qt&&view[p.qt]&&view[p.qt].p.al&&p.q&&!p.q.startsWith('待機')&&!p.q.startsWith('道具')){if(!tm[p.qt]||p.id===myId)tm[p.qt]=p.id===myId?2:1}});
 for(const id in tm){const r=getR(ri++),v=view[id];r.visible=true;r.position.x=v.x;r.position.z=v.z;r.scale.setScalar(v.sc*pulse);r.material.color.setHex(tm[id]===2?0xffdd33:0x66ddff)}}
for(;ri<tR.length;ri++)tR[ri].visible=false;
const av=dw&&dw.t===myId&&view[dw.aid];atkRing.visible=!!av;if(av){atkRing.position.x=av.x;atkRing.position.z=av.z;atkRing.scale.setScalar(av.sc*(1.3+.25*Math.sin(now/90)))}
rangeRing.visible=inB&&!!mp&&mp.al;rangeRing.position.set(me.x,.05,me.z);rangeRing.scale.setScalar(myRng(mp));
let gp,look;if(!inB||!foc){gp=new THREE.Vector3(me.x,26,me.z+13);look=new THREE.Vector3(me.x,0,me.z)}
else{const dx=foc.x-me.x,dz=foc.z-me.z,Ld=Math.hypot(dx,dz)||1;gp=new THREE.Vector3(me.x-dx/Ld*9,6,me.z-dz/Ld*9);look=new THREE.Vector3(me.x+dx/Ld*5,1.5,me.z+dz/Ld*5)}
const kk=1-Math.exp(-3*dt);cam.position.lerp(gp,kk);lk.lerp(look,kk);cam.lookAt(lk);
const low=mp&&mp.al&&mp.h/mp.m<=.25;flash=Math.max(0,flash-dt*1.6);$('flash').style.opacity=Math.min(1,flash*.9+(low?.28+.06*Math.sin(now/400):0))}
fxs=fxs.filter(x=>{x.t+=dt;const p=Math.min(1,x.t/x.dur);x.upd(p);if(p>=1){x.done();return false}return true});
shake=Math.max(0,shake-dt);const so=shake>0?new THREE.Vector3((Math.random()-.5)*shake*1.6,(Math.random()-.5)*shake*1.6,0):null;
if(so)cam.position.add(so);rd.render(scene,cam);if(so)cam.position.sub(so);drawMini(now)}

/* ===== 開始前：能力値を3D6で決める ===== */
let rolled=0;
function animDice(c,done){const fin=rollA(3,6);let k=0;c.innerHTML=dieHtml(fin.map(()=>({v:'?'})),0);const iv=setInterval(()=>{c.innerHTML=dieHtml(fin.map(()=>({v:d(6)})),0);if(++k>10){clearInterval(iv);c.innerHTML=dieHtml(fin.map(v=>({v})),1);done(sumA(fin))}},70)}
function rollStat(k,row){row.querySelector('button').disabled=true;animDice(row.querySelector('.dc'),t=>{myStats[k]=t;row.querySelector('b').textContent=t;rolled++;derived()})}
let gifted=0;
function derived(){const s=myStats,tot=ST.reduce((a,[k])=>a+(s[k]||0),0);if(rolled<6){$('der').textContent=`あと${6-rolled}つ振ってください（現在の合計${tot}）`;return}
if(tot>90&&!gifted){$('der').textContent=`合計${tot}`;const g=$('gift');g.hidden=false;g.innerHTML=`<b style="color:#fd8">✨ ギフテッド！</b><br>合計が90を超えました。値を1にするステータスを1つ選んでください。<br>`+ST.map(([k,n])=>`<button data-k="${k}" style="margin:3px">${n}(${s[k]})→1</button>`).join('');
 g.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{myStats[bt.dataset.k]=1;gifted=1;g.hidden=true;const i=ST.findIndex(x=>x[0]===bt.dataset.k);$('stats').children[i].querySelector('b').textContent=1;derived()});return}
$('der').textContent=`合計${tot}${gifted?'（ギフテッドで1つを1に）':''}　HP${(s.con+s.siz)*2}  MP${(s.pow+s.int)*2}  SAN${s.pow*3}  DB${dbTxt(dbOf(s.str+s.siz))}`;['b1','b2','b3'].forEach(i=>$(i).disabled=false)}
ST.forEach(([k,n])=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${n}</span><span class="dc"></span><b></b><button>振る</button>`;r.querySelector('button').onclick=()=>rollStat(k,r);$('stats').appendChild(r)});
$('rall').onclick=()=>{[...$('stats').children].forEach((r,i)=>{if(!r.querySelector('button').disabled)setTimeout(()=>rollStat(ST[i][0],r),i*150)})};
Object.entries(CL).forEach(([k,c])=>{const b=document.createElement('button');b.textContent=c.n;b.onclick=()=>{myCls=k;[...$('cls').children].forEach(x=>x.classList.toggle('on',x===b));$('cn').textContent=c.note};if(k===myCls){b.className='on';$('cn').textContent=c.note}$('cls').appendChild(b)});
function begin(code){const nm=$('nm').value||'冒険者';$('menu').hidden=true;$('hud').hidden=false;$('room').textContent=code?`部屋コード：${code}`:'ひとりプレイ';buildActs();$('mini').hidden=false;miniOn=true;$('mini').onclick=()=>{miniOn=false;$('mini').hidden=true};buildWorld();
if(isHost){mkP('H',nm,myCls,myStats,$('tc').value);initWorld();myId='H';let last=performance.now();setInterval(()=>{const n=performance.now();tick(Math.min((n-last)/1000,.2));last=n},50)}
else send({t:'join',name:nm,cls:myCls,st:myStats,tc:$('tc').value});
cam.position.set(-8,26,19);lk.set(-8,0,6);requestAnimationFrame(frame)}
$('bi').onclick=()=>{if($('inv').hidden)openInv();else $('inv').hidden=true};
function needPeer(){if(typeof Peer==='undefined'){alert('PeerJSが読み込めません。ネット接続を確認してください。');return 1}}
$('b1').onclick=()=>{isHost=true;begin('')};
$('b2').onclick=()=>{if(needPeer())return;isHost=true;const code=Math.random().toString(36).slice(2,6).toUpperCase();peer=new Peer('trpgproto-'+code);peer.on('open',()=>begin(code));
peer.on('connection',c=>{conns[c.peer]=c;c.on('data',m=>hostRecv(c.peer,m,c));c.on('close',()=>{const a=A[c.peer];delete conns[c.peer];delete A[c.peer];if(a)log(`${a.name}が退出した`)})});peer.on('error',e=>alert('接続エラー：'+e.type))};
$('b3').onclick=()=>{if(needPeer())return;const code=$('code').value.trim().toUpperCase();if(!code)return alert('部屋コードを入力してください');
peer=new Peer();peer.on('open',()=>{conn=peer.connect('trpgproto-'+code,{reliable:true});conn.on('open',()=>begin(code));conn.on('data',onMsg);conn.on('close',()=>alert('ホストとの接続が切れました'))});
peer.on('error',e=>alert('接続エラー：'+e.type+'（コードを確認してください）'))};
